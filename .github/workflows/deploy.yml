name: Publicar no GitHub Pages

# Publica a cada push na main. Também dá para disparar na mão pela aba Actions.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Permissões que o deploy do Pages exige.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build estático
        run: npm run build
        env:
          # Liga o `output: export` e o basePath, veja `next.config.ts`.
          EXPORTAR_ESTATICO: "1"

      - name: Desligar o Jekyll
        # Sem isso o Pages ignora a pasta `_next`, porque começa com underline.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
